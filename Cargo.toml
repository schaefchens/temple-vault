[package]
name = "temple-vault"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Encrypted storage with plausible deniability: one file, any number of spaces, each opened by its own 12 words"
repository = "https://github.com/schaefchens/temple-vault"
readme = "README.md"
keywords = ["encryption", "deniability", "sqlite", "vault", "privacy"]
categories = ["cryptography", "database"]
include = ["/src", "/examples/argon2_time.rs", "/README.md", "/LICENSE"]

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }
chacha20 = "0.10"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1"
# Only for their `zeroize`: the hash states inside Argon2 and HKDF are wiped when dropped.
blake2 = { version = "0.11", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }

# On the web: the browser's random source and clock, and its origin private file system.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
# rusqlite's SQLite there: its clock, sleep and random source come from the browser.
sqlite-wasm-rs = { version = "0.6", default-features = false, features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["FileSystemReadWriteOptions", "FileSystemSyncAccessHandle"] }

# The lock on a vault's file: flock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
tempfile = "3"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# Entry points for the fuzz targets in fuzz/; not part of the API.
fuzzing = []

# Argon2 and SQLite are slow without optimization; tests derive many keys.
[profile.dev.package."*"]
opt-level = 3
