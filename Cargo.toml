[package]
name = "temple"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Vaults: one file, any number of spaces, each opened by its own 12 words"
publish = false

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20 = "0.10"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[features]
# Entry points for the fuzz targets in fuzz/; not part of the API.
fuzzing = []

# Argon2 and SQLite are slow without optimization; tests derive many keys.
[profile.dev.package."*"]
opt-level = 3
