# Temple's tests on every push: the Rust suite natively – optimized, and once as a debug build
# for its overflow checks – and on wasm32, the bindings crate, formatting, clippy, RustSec's
# advisories, and the web demo's Playwright run – Chromium and Firefox on Linux, WebKit on
# macOS. The React Native E2E run needs simulators and stays local: tools/e2e_react_native.sh.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: cargo check --manifest-path bindings/ffi/Cargo.toml --locked

  rust-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Integer overflow is caught only without --release.
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      # Warns of basic-toml, unmaintained, which UniFFI's templates use while building.
      - run: cargo audit --file bindings/ffi/Cargo.lock

  wasm:
    runs-on: ubuntu-latest
    env:
      # SQLite's C code for wasm32 needs LLVM's clang and ar.
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y clang llvm
      - name: wasm-bindgen-cli at Cargo.lock's version
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
      - run: tools/test_on_wasm.sh

  web-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox
            projects: --project=chromium --project=firefox
          # Outside Apple's systems WebKit gives an origin 1,000 MB, and counts a reopened
          # vault again once it grows: vaults stop at about 450 MB (docs/design.md).
          - os: macos-latest
            browsers: webkit
            projects: --project=webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # LLVM's clang and ar for SQLite's C code; bindings/web/build.sh finds Homebrew's.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y clang llvm
          echo CC_wasm32_unknown_unknown=clang >> "$GITHUB_ENV"
          echo AR_wasm32_unknown_unknown=llvm-ar >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: brew install llvm
      - name: wasm-bindgen-cli at the bindings' Cargo.lock version
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --manifest-path bindings/ffi/Cargo.toml --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
      - run: npm ci
      - run: npm run build -w @schaefchens/temple-web
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
        working-directory: examples/web
      - run: npm run e2e -w temple-demo-web -- ${{ matrix.projects }}
