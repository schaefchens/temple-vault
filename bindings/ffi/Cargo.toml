[package]
name = "temple-ffi"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Temple for TypeScript: the API UniFFI exports to React Native and the web"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
temple-vault = { path = "../.." }
uniffi = "0.31"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-channel = "0.3"

# On the web: the module runs in a worker, its vaults in the origin private file system.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
uniffi-runtime-wasm = "=0.31.0-6"
uniffi_core = { version = "0.31", features = ["wasm-unstable-single-threaded"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemSyncAccessHandle",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

# Argon2 and SQLite are slow without optimization.
[profile.dev.package."*"]
opt-level = 3
